<!DOCTYPE html>
<html lang="en">

<!-- ===================================
        HEAD SECTION
=================================== -->

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <!-- Dashboard CSS -->
    <link rel="stylesheet" href="dashboard.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- ===================================
        DASHBOARD WRAPPER
=================================== -->

<div class="dashboard">

    <!-- ===================================
            SIDEBAR
    =================================== -->

    <aside class="sidebar">

        <!-- ===================================
                LOGO
        =================================== -->

        <div class="logo">

            <i class="fa-solid fa-layer-group"></i>

            <span id="sidebarUsername">
                Loading...
            </span>

        </div>

        <!-- ===================================
                NAVIGATION MENU
        =================================== -->

        <nav>

            <ul class="menu">

                <li class="menu-item active">

                    <i class="fa-solid fa-house"></i>

                    <span class="menu-text">
                        Dashboard
                    </span>

                </li>

                <li class="menu-item">

                    <i class="fa-solid fa-user"></i>

                    <span class="menu-text">
                        Profile
                    </span>

                </li>

                <li class="menu-item">

                    <i class="fa-solid fa-chart-line"></i>

                    <span class="menu-text">
                        Analytics
                    </span>

                </li>

                <li class="menu-item">

                    <i class="fa-solid fa-file-lines"></i>

                    <span class="menu-text">
                        Reports
                    </span>

                </li>

                <li class="menu-item">

                    <i class="fa-solid fa-gear"></i>

                    <span class="menu-text">
                        Settings
                    </span>

                </li>

            </ul>

        </nav>

        <!-- ===================================
                SIDEBAR BUTTONS
        =================================== -->

        <div class="sidebar-bottom">

            <button id="dashboardTheme">

                <i class="fa-solid fa-moon"></i>

                <span>
                    Theme
                </span>

            </button>

            <button id="logoutBtn">

                <i class="fa-solid fa-right-from-bracket"></i>

                <span>
                    Logout
                </span>

            </button>

        </div>

    </aside>

    <!-- ===================================
            MAIN CONTENT
    =================================== -->

    <main class="main-content">

        <!-- ===================================
                TOP HEADER
        =================================== -->

        <header class="topbar">

            <div>

                <h2 id="greeting">

                    Good Morning ☀️,

                    <span id="displayUsername">
                        User
                    </span>

                </h2>

                <p id="currentDate">
                    Loading date...
                </p>

            </div>

        </header>

        <!-- ===================================
                DASHBOARD CARDS
        =================================== -->

        <section class="cards">

            <div class="card">

                <i class="fa-solid fa-users"></i>

                <h3>Total Users</h3>

                <h2 id="usersCount">
                    0
                </h2>

            </div>

            <div class="card">

                <i class="fa-solid fa-dollar-sign"></i>

                <h3>Revenue</h3>

                <h2 id="revenueCount">
                    $0
                </h2>

            </div>

            <div class="card">

                <i class="fa-solid fa-file-lines"></i>

                <h3>Reports</h3>

                <h2 id="reportsCount">
                    0
                </h2>

            </div>

            <div class="card">

                <i class="fa-solid fa-sliders"></i>

                <h3>Settings</h3>

                <h2 id="settingsCount">
                    4
                </h2>

            </div>

        </section>

        <!-- ===================================
                RECENT ACTIVITY
        =================================== -->

        <section class="recent-activity">

            <div class="section-header">

                <h2>
                    Recent Activity
                </h2>

            </div>

            <div class="activity-box">

                <p>

                    🚀 No recent activity available.

                </p>

            </div>

        </section>

        <!-- ===================================
                ANALYTICS CHART
        =================================== -->

        <section class="chart-section">

            <div class="section-header">

                <h2>

                    Analytics Overview

                </h2>

            </div>

            <div class="chart-box">

                <canvas id="dashboardChart"></canvas>

            </div>

        </section>

    </main>

</div>

<!-- ===================================
        CHART.JS
=================================== -->

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- ===================================
        DASHBOARD JAVASCRIPT
=================================== -->

<script src="dashboard.js"></script>

</body>

</html>
