<!DOCTYPE html>
<html lang="en">

<!-- ===================================
        HEAD SECTION
=================================== -->

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <!-- ===================================
            THEME TOGGLE BUTTON
    =================================== -->

    <button
        id="themeToggle"
        class="theme-btn"
        aria-label="Toggle Dark Mode">

        <i class="fa-solid fa-moon"></i>

    </button>


    <!-- ===================================
            LOGIN CARD
    =================================== -->

    <div class="login-container">

        <!-- ===================================
                LOGIN TITLE
        =================================== -->

        <h1>Login</h1>


        <!-- ===================================
                LOGIN FORM
        =================================== -->

        <form id="loginForm">

            <!-- ===================================
                    USERNAME
            =================================== -->

            <div class="input-group">

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder=" "
                    autocomplete="username"
                    required>

                <label for="username">
                    Username
                </label>

                <!-- Validation Icon -->

                <span
                    id="usernameIcon"
                    class="validation-icon">
                </span>

                <!-- Error -->

                <small
                    id="usernameError"
                    class="error-message">
                </small>

            </div>


            <!-- ===================================
                    PASSWORD
            =================================== -->

            <div class="input-group">

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder=" "
                        autocomplete="current-password"
                        required>

                    <label for="password">
                        Password
                    </label>

                    <!-- Eye Button -->

                    <span id="togglePassword">

                        <i class="fa-solid fa-eye"></i>

                    </span>

                    <!-- Validation Icon -->

                    <span
                        id="passwordIcon"
                        class="validation-icon">
                    </span>

                </div>

                <!-- ===================================
                        PASSWORD STRENGTH
                =================================== -->

                <div class="strength-meter">

                    <div id="strengthBar"></div>

                </div>

                <p
                    id="strengthText"
                    class="strength-text">
                </p>

                <!-- Password Error -->

                <small
                    id="passwordError"
                    class="error-message">
                </small>

            </div>


            <!-- ===================================
                    OPTIONS
            =================================== -->

            <div class="options">

                <label class="remember-me">

                    <input
                        type="checkbox"
                        id="rememberMe">

                    Remember Me

                </label>

                <a
                    href="forgot.html"
                    class="forgot-password">

                    Forgot Password?

                </a>

            </div>


            <!-- ===================================
                    LOGIN BUTTON
            =================================== -->

            <button
                type="submit"
                id="loginButton">

                <span class="btn-text">

                    Login

                </span>

                <span class="spinner"></span>

            </button>


            <!-- ===================================
                    REGISTER
            =================================== -->

            <p class="bottom-text">

                Don't have an account?

                <a href="register.html">

                    Register

                </a>

            </p>

        </form>

    </div>


    <!-- ===================================
            TOAST
    =================================== -->

    <div
        id="toast"
        class="toast">
    </div>


    <!-- ===================================
            JAVASCRIPT
    =================================== -->

    <script src="script.js"></script>

</body>

</html>
